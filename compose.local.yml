# Local PostgreSQL integration only. This serves Django's development server on loopback.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hexu
      POSTGRES_USER: hexu
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD:?Set ERP_DB_PASSWORD in .env}
    volumes:
      - hexu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexu -d hexu"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py init_demo && python manage.py runserver 0.0.0.0:8000 --noreload"]
    environment:
      ERP_DEBUG: "1"
      ERP_DB_HOST: db
      ERP_DB_NAME: hexu
      ERP_DB_USER: hexu
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:?Set ERP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8765:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  hexu_pg:
