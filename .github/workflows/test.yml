name: ERP tests
on: [push, pull_request]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.lock.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: node --check static/app.js
      - run: node --check static/stock-ui.js
      - run: python manage.py migrate --noinput
      - run: python manage.py init_demo
      - run: python scripts/rehearse_restore.py
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hexu
          POSTGRES_USER: hexu
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexu -d hexu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ERP_DB_HOST: 127.0.0.1
      ERP_DB_NAME: hexu
      ERP_DB_USER: hexu
      ERP_DB_PASSWORD: ci-only-ephemeral-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock.txt -r requirements-production.txt
      - run: python manage.py test
      - run: python manage.py migrate --noinput
      - run: python manage.py init_demo
      - run: python scripts/rehearse_restore.py
