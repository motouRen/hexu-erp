{% load static %}
<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 禾序 ERP</title><link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml"><link rel="stylesheet" href="{% static 'app.css' %}"></head>
<body class="login-body"><main class="login-layout"><section class="login-story"><a href="/" class="brand"><span class="brand-mark">禾</span><span>禾序 <b>ERP</b><small>RETAIL WORKSPACE</small></span></a><div><span class="eyebrow">从订单到门店</span><h1>每一笔生意，<br>都有清晰的来处。</h1><p>商品、渠道与库存，在同一张工作台上有序流转。</p><div class="login-flow"><span>订单</span><i>→</i><span>库存</span><i>→</i><span>收款</span></div></div><span class="login-footnote">开源零售 ERP · v0.1</span></section><section class="login-form-wrap"><form method="post" class="login-form">{% csrf_token %}<div class="eyebrow">WELCOME BACK</div><h2>登录工作台</h2><p>使用管理员为你创建的账号。</p>{% if form.errors %}<div class="form-error">账号或密码不正确，请重试。</div>{% endif %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<label>账号<input name="username" autocomplete="username" required autofocus maxlength="150" placeholder="输入账号"></label><label>密码<input type="password" name="password" autocomplete="current-password" required placeholder="输入密码"></label><button class="button primary" type="submit">登录工作台 <span>→</span></button><small>首次启动生成的账号信息保存在 LOCAL_ACCESS.txt。</small></form></section></main></body></html>
